# Kopieren nach secrets.yaml und ausfüllen. secrets.yaml NICHT committen.

# Haupt-WLAN
wifi_ssid: "DEIN-WLAN"
wifi_password: "DEIN-WLAN-PASSWORT"

# Zweites WLAN (z. B. Gäste-WLAN oder Handy-Hotspot) – sonst gleiche Werte wie oben
wifi_ssid_2: "ZWEITES-WLAN"
wifi_password_2: "ZWEITES-PASSWORT"

# Fallback-Hotspot "Mini-Radio-Setup" (mind. 8 Zeichen)
ap_password: "setup1234"

# Home-Assistant-API (openssl rand -base64 32)
api_key: "BASE64-KEY"

# OTA-Updates
ota_password: "EIN-OTA-PASSWORT"

# Webinterface (Benutzer: admin)
web_password: "EIN-WEB-PASSWORT"
